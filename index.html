<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日重要邀請 🎂</title>
    <!-- 引入樣式表 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- 核心提問標題 -->
        <h1 id="title">親愛的香香，你願意幫 Adam 過生日嗎？ 🎂</h1>
        
        <!-- 按鈕互動區塊 -->
        <div class="btn-group">
            <button id="yesBtn" class="btn btn-yes">願意 😍</button>
            <button id="noBtn" class="btn btn-no">不願意 😢</button>
        </div>

        <!-- 女友點擊「願意」後才會顯示的驚喜慶祝區塊 -->
        <div id="celebration" class="hidden">
            <div class="heart">❤️</div>
            <h2>耶！最愛香香了 🥰 我們一起過生日！🎉</h2>
            <!-- 可自行替換為客製化的 Giphy 浪漫動圖或照片 -->
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExMmszdnB6NTFpOHB6b3E0bHpxb3M0bXp3OHh5b3M0bXp3OHh5b3M0bSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cPxSmclwOQ0uA/giphy.gif" alt="Happy Dance" class="celebrate-gif">
        </div>
    </div>

    <!-- 依序載入 MVC 架構的 JavaScript 檔案 -->
    <script src="model.js"></script>
    <script src="view.js"></script>
    <script src="controller.js"></script>
    <script src="app.js"></script>
</body>
</html>
