<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>我們的片單 (MVC架構版)</title>
    <link rel="stylesheet" href="theme/style.css">
</head>
<body>

<div class="app-container">
    <h1>🎬 我們的片單</h1>
    <div class="version">v3.0.0 (MVC 架構重構版)</div>

    <!-- 🗂️ 頁籤切換列 -->
    <div class="tab-container">
        <button class="tab-btn active" data-target="tab-main">🎬 影片管理</button>
        <button class="tab-btn" data-target="tab-settings">⚙️ 系統設定</button>
    </div>

    <!-- ========================================== -->
    <!-- 🎬 分頁一：主程式功能面 -->
    <!-- ========================================== -->
    <div id="tab-main" class="tab-content active">
        <div class="section">
            <div class="section-title">📌 功能一：新增播放清單</div>
            <input type="text" id="add-title" placeholder="請輸入片名">
            <select id="add-country">
                <option value="台">台</option><option value="陸">陸</option>
                <option value="港">港</option><option value="日韓">日韓</option>
                <option value="東南亞">東南亞</option><option value="洋">洋</option>
            </select>
            <select id="add-type">
                <option value="電影">電影</option><option value="劇">劇</option>
                <option value="卡通/動漫">卡通/動漫</option>
            </select>
            <select id="add-status">
                <option value="看完">看完</option>
                <option value="沒看" selected>沒看</option>
                <option value="進行中">進行中</option>
            </select>
            <input type="text" id="add-episode" placeholder="第幾集？ (選進行中才需填寫)" style="display:none;">
            <button id="btn-add">確認新增至 Notion</button>
        </div>

        <div class="section">
            <div class="section-title">🔍 功能二：查詢進度 / 連結</div>
            <button id="btn-query" class="btn-query">點擊查詢當前所有片單</button>
        </div>

        <div class="section">
            <div class="section-title">🔄 功能三：更新影片進度</div>
            <input type="text" id="update-title" placeholder="請輸入要更新的精確片名">
            <select id="update-status">
                <option value="看完">看完</option>
                <option value="沒看">沒看</option>
                <option value="進行中" selected>進行中</option>
            </select>
            <input type="text" id="update-remark" placeholder="請輸入進度備註 (非進行中則留空)">
            <button id="btn-update" class="btn-update">確認更新進度</button>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- ⚙️ 分頁二：獨立設定密鑰面 -->
    <!-- ========================================== -->
    <div id="tab-settings" class="tab-content">
        <div class="section">
            <div class="section-title">🔑 個人 Notion 密鑰設定</div>
            <p class="hint-text">請輸入您個人的 Notion 整合憑證。此資料將加密安全地保存在您本機瀏覽器中。</p>
            
            <label class="setting-label">Notion Integration Token:</label>
            <input type="password" id="cfg-token" placeholder="secret_ 開頭的字串">
            
            <label class="setting-label">Database ID:</label>
            <input type="text" id="cfg-dbid" placeholder="32位元的資料庫ID">
            
            <button id="btn-save-settings" class="btn-save">儲存設定</button>
            <button id="btn-clear-settings" class="btn-danger">清除本機全部資料</button>
        </div>
    </div>
</div>

<!-- 引入 App 進入點，必須設定 type="module" -->
<script type="module" src="js/app.js"></script>
</body>
</html>
